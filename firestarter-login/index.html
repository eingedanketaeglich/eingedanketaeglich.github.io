<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Firestarter ist umgezogen</title>
<style>
html,body{margin:0;height:100%;background:#102444;color:#FFFFFF;font:500 17px/1.5 -apple-system,system-ui,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px max(24px,env(safe-area-inset-left)) 24px max(24px,env(safe-area-inset-right));box-sizing:border-box;max-width:520px;margin:0 auto}
h1{font-size:26px;line-height:1.2;margin:0}
p{margin:0;color:#D8DEE9}
a{display:block;text-align:center;background:#FF7A00;color:#102444;font-weight:700;text-decoration:none;padding:15px;border-radius:999px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Firestarter ist umgezogen.</h1>
<p>Die App findest du jetzt unter app.rf-institut.de. Dein Lernstand von diesem Gerät kommt mit, du meldest dich dort einmal mit deinem Konto an.</p>
<p id="fund" style="color:#FFFFFF;font-weight:700">Ich schaue nach deinem Lernstand …</p>
<a id="weiter" href="https://app.rf-institut.de/">Zur neuen App</a>
</main>
<script>
/* Umleitung der alten GitHub-App (Simon 20.11.2026): Lernstand dieses Geraets (localStorage fs13_*) mitnehmen.
   Die neue App fuehrt ihn beim Anmelden mit dem Konto zusammen (rf-konto.js, fs_umzug). */
(function(){
  var ziel = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8095/' : 'https://app.rf-institut.de/';
  /* Alle Konten dieses Geraets mitnehmen (v2): fs13_<mail> gehoert zum Konto <mail>; der allererste Schluessel fs13 gehoert simon@. */
  var konten = {}, anzahl = 0;
  function nimm(mail, v) {
    if (!v || !Array.isArray(v.done)) return;
    var n = v.done.length; for (var s in (v.steps || {})) n += (v.steps[s] || []).length;
    if (!n) return;
    var a = konten[mail];
    if (a) {   /* zwei Staende fuer dieselbe Adresse: zusammenlegen */
      v.done.forEach(function (x) { if (a.done.indexOf(x) < 0) a.done.push(x); });
      for (var k in (v.steps || {})) { var t = a.steps[k] || []; (v.steps[k] || []).forEach(function (x) { if (t.indexOf(x) < 0) t.push(x); }); a.steps[k] = t; }
      return;
    }
    konten[mail] = { done: v.done.slice(), steps: v.steps || {}, pos: v.pos || {}, zuletzt: v.zuletzt || [] }; anzahl++;
  }
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i), mail = k.indexOf('fs13_') === 0 ? k.slice(5).toLowerCase() : '';
      if (!mail || mail === 'gast' || mail.indexOf('@') < 0) continue;
      try { nimm(mail, JSON.parse(localStorage.getItem(k))); } catch (e) {}
    }
    /* der allererste Schluessel zuletzt: ergaenzt simon@ nur um erledigte Lektionen und Schritte */
    try { nimm('simon@rf-institut.de', JSON.parse(localStorage.getItem('fs13'))); } catch (e) {}
  } catch (e) {}
  var url = ziel;
  if (anzahl) {
    try {
      var b = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 2, konten: konten })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      if (b.length < 60000) url = ziel + '#umzug=' + b;
    } catch (e) {}
  }
  document.getElementById('weiter').href = url;
  /* 20.11.2026: kurz zeigen, was hier gefunden wurde, damit klar ist, ob dieses Geraet alte Staende hat */
  var fund = document.getElementById('fund'), namen = Object.keys(konten).map(function (m) { return m.split('@')[0] + ' (' + konten[m].done.length + ' Lektionen fertig)'; });
  fund.textContent = anzahl ? 'Gefunden und wird mitgenommen: ' + namen.join(', ') + '. Melde dich gleich mit s.schlerf@ an.' : 'Hier liegen keine alten Lernstände. Du kommst direkt zur neuen App.';
  setTimeout(function () { location.replace(url); }, anzahl ? 4000 : 2500);
})();
</script>
</body>
</html>
